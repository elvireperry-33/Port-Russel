<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port de Plaisance Russel</title>
</head>
<body>
    <h1>Port de Plaisance Russel</h1>
    <p>Bienvenue sur le Port de Plaisance Russel !</p>
<h2>Connexion</h2>
<form id="loginForm">
    <label for="email">Email :</label>
    <input type="email" id="email" name="email" required>
    <br>
    <label for="password">Mot de passe :</label>
    <input type="password" id="password" name="password" required>
    <br>
    <button type="submit">Se connecter</button>
</form> 
<p><a> href="/documentation.html">Documentation de l'API</a></p>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('userEmail', data.user.email);
                alert('Connexion réussie !');
                window.location.href = '/dashboard';
            } else {
                const errorData = await response.json();
                alert('Erreur de connexion : ' + errorData.message);
            }
        } catch (error) {
            console.error('Erreur lors de la connexion :', error);
            alert('Erreur lors de la connexion. Veuillez réessayer.');
        }
    });
</script>
</body>
</html>
